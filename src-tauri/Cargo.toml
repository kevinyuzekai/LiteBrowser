[package]
name = "litebrowser"
version = "0.1.0"
description = "LiteBrowser 轻量浏览器"
authors = ["kevinyuzekai"]
license = "MIT"
edition = "2021"

[lib]
name = "litebrowser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
